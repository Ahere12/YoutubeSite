<!DOCTYPE html>
<html>
    <head>
        <title>Youtube.com Clone</title>
        <style>
            .thumbnail{
                width: 300px;
                display:block
            }
            .search-bar{
                font-size: 20px;
                margin-left: 12px ;
            }

            .video-title{
                width: 300px;
            }

            .video-author,
            .video-stats{
                display: inline-block;
            }

        </style>
    </head>
    <body>
        <input class="search-bar" type="text"
        placeholder="Search">
        <img src="thumbnails/thumbnail-1.webp">
        

        <p class="video-title">
            
            Talking Tech <strong>and AI with</strong> Google CEO Sundar Pichai!
         </p>
        <p class="video-author">
            Marques Brownlee
        </p>
        <p class="video-stats">
            3.4M views &#124; 6 months ago
        </p>
        <div>
            this is a dev
        </div>
    </body>
</html>
